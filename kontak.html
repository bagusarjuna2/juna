        }

        .header {
            background-color: #8b0000;
            color: white;
            text-align: center;

        }

        .contact-card {
            background-color: white;

            color: #8b0000;
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-item {
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fff8f0;
            border-radius: 10px;
        }

        .contact-item strong {
            display: block;
            color: #8b0000;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .contact-item p {
            margin: 0;
            font-size: 16px;
        }

        .contact-item a {
            color: #8b0000;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #222;
            color: white;
            text-align: center;
        }
