<!DOCTYPE html>
<html>

<head>
    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .product-card {
            background-color: white;
            width: 250px;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product-card h2 {
            font-size: 20px;
            margin: 15px 0 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            background-color: black;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <!-- Product 1 -->
        <div class="product-card">
            <img src="../iframe/combo.avif" alt="Tenders Combo">

            <h2>The Tenders Duo Combo</h2>

            <p class="price">Rp 75.000</p>

            <a href="https://share.google/3DUQ3EZiLZcUaCbCR"
               class="button"
               target="_blank">
                Beli
            </a>
        </div>


        <!-- Product 2 -->
        <div class="product-card">
            <img src="../iframe/sandwich.avif" alt="Sandwich Combo">

            <h2>The Crown Hot Sandwich Combo</h2>

            <p class="price">Rp 62.500</p>

            <a href="https://share.google/66iy8FGfd16pjmEct"
               class="button"
               target="_blank">
                Beli
            </a>
        </div>


        <!-- Product 3 -->
        <div class="product-card">
            <img src="../iframe/nashville.avif" alt="Nashville Combo">

            <h2>Nashville Mozzarella Stick Combo</h2>

            <p class="price">Rp 50.000</p>

            <a href="https://share.google/u3AyDdeJhumxz8r86"
               class="button"
               target="_blank">
                Beli
            </a>
        </div>


        <!-- Product 4 -->
        <div class="product-card">
            <img src="../iframe/fries.jpg" alt="French Fries">

            <h2>French Fries</h2>

            <p class="price">Rp 35.000</p>

            <a href="https://share.google/Tf3C1dP7RyaIK4OZm"
               class="button"
               target="_blank">
                Beli
            </a>
        </div>


        <!-- Product 5 -->
        <div class="product-card">
            <img src="../iframe/cola.avif" alt="Cola Drink">

            <h2>Cola Drink</h2>

            <p class="price">Rp 20.000</p>

            <a href="https://share.google/x9cx8qgMnERLqNLTs"
               class="button"
               target="_blank">
                Beli
            </a>
        </div>

    </div>

</body>

</html>
